name: Build Android APK (Kasir Offline)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Accept Android SDK Licenses
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Web Application
      run: npm run build

    - name: Initialize & Sync Capacitor Android Studio Project
      run: |
        # Ensure Capacitor assets directory exists
        mkdir -p dist
        # If android folder doesn't exist, create it via CLI dynamically
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        # Sync the web dist folder with Android source assets folder
        npx cap sync android

    - name: Build Android Debug APK with Gradle
      working-directory: android
      run: |
        # Download a clean gradle-wrapper.jar to replace any corrupted or CRLF-converted version
        curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasir-offline-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
