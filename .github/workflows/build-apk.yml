name: Build Android APK (Kasir Offline)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Accept Android SDK Licenses
      run: |
        yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

    - name: Build Web Application
      run: npm run build

    - name: Initialize & Sync Capacitor Android Studio Project
      run: |
        # Ensure Capacitor assets directory exists
        mkdir -p dist
        # If android folder doesn't exist, create it via CLI dynamically
        if [ ! -d "android" ]; then
          npx cap add android
        fi
        # Sync the web dist folder with Android source assets folder
        npx cap sync android

    - name: Build Android Debug APK with Gradle
      working-directory: android
      run: |
        # Generate pristine gradle-wrapper.jar and gradlew files using preinstalled system Gradle in a clean temp directory
        mkdir -p /tmp/wrapper-setup
        cd /tmp/wrapper-setup
        if gradle wrapper --gradle-version 8.10.2; then
          echo "Successfully generated wrapper via system Gradle in clean directory"
          cd -
          cp /tmp/wrapper-setup/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
          cp /tmp/wrapper-setup/gradlew gradlew
          cp /tmp/wrapper-setup/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
        else
          echo "System gradle failed, trying direct copy from system installation"
          cd -
          # Alternative system fallback
          find /opt/hostedtoolcache/ /usr/share/gradle/ -name "gradle-wrapper-*.jar" -o -name "gradle-wrapper.jar" 2>/dev/null | head -n 1 | xargs -I {} cp {} gradle/wrapper/gradle-wrapper.jar
        fi
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kasir-offline-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
